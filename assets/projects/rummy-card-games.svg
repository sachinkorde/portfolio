<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="t">
  <title id="t">Multiplayer Rummy card game illustration</title>
  <defs>
    <radialGradient id="felt" cx="50%" cy="45%" r="75%"><stop offset="0" stop-color="#11734a"/><stop offset="1" stop-color="#063821"/></radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity=".45"/></filter>
  </defs>
  <rect width="640" height="360" fill="url(#felt)"/>
  <ellipse cx="320" cy="200" rx="270" ry="130" fill="none" stroke="#f5c242" stroke-opacity=".35" stroke-width="3"/>
  <g filter="url(#sh)" font-family="Georgia, serif" font-weight="700">
    <g transform="translate(320 300) rotate(-30)"><rect x="-55" y="-210" width="110" height="160" rx="10" fill="#fff"/><text x="-42" y="-180" font-size="28" fill="#c81e3a">7</text><text x="0" y="-115" font-size="54" text-anchor="middle" fill="#c81e3a">♥</text></g>
    <g transform="translate(320 300) rotate(-15)"><rect x="-55" y="-210" width="110" height="160" rx="10" fill="#fff"/><text x="-42" y="-180" font-size="28" fill="#111">8</text><text x="0" y="-115" font-size="54" text-anchor="middle" fill="#111">♠</text></g>
    <g transform="translate(320 300) rotate(0)"><rect x="-55" y="-210" width="110" height="160" rx="10" fill="#fff"/><text x="-42" y="-180" font-size="28" fill="#c81e3a">9</text><text x="0" y="-115" font-size="54" text-anchor="middle" fill="#c81e3a">♦</text></g>
    <g transform="translate(320 300) rotate(15)"><rect x="-55" y="-210" width="110" height="160" rx="10" fill="#fff"/><text x="-44" y="-180" font-size="28" fill="#111">10</text><text x="0" y="-115" font-size="54" text-anchor="middle" fill="#111">♣</text></g>
    <g transform="translate(320 300) rotate(30)"><rect x="-55" y="-210" width="110" height="160" rx="10" fill="#fff"/><text x="-42" y="-180" font-size="28" fill="#c81e3a">J</text><text x="0" y="-115" font-size="54" text-anchor="middle" fill="#c81e3a">♥</text></g>
  </g>
  <g font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#06261a">
    <circle cx="70" cy="70" r="26" fill="#22d3ee"/><text x="70" y="75" text-anchor="middle">P1</text>
    <circle cx="570" cy="70" r="26" fill="#f472b6"/><text x="570" y="75" text-anchor="middle">P2</text>
    <circle cx="70" cy="300" r="26" fill="#fbbf24"/><text x="70" y="305" text-anchor="middle">P3</text>
    <circle cx="570" cy="300" r="26" fill="#a855f7"/><text x="570" y="305" text-anchor="middle">P4</text>
  </g>
</svg>
